server {
  listen 8080;
  root /usr/share/nginx/html;
  default_type application/json;   # /health sans extension
  location / { default_type text/html; try_files $uri /index.html; }
  location /assets/ { include /etc/nginx/mime.types; }
  location /api/ { return 503; }   # shortcut: API Python non déployée (DEC-008)
}
