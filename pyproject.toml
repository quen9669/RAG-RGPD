[project]
name = "rag-rgpd"
version = "0.1.0"
description = "Assistant RAG sur la protection des données au Luxembourg, qui cite ses sources."
readme = "README.md"
authors = [
    { name = "FRANKS" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lancedb>=0.41.0",
    "numpy>=2.5.4",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-ingest = "rag_rgpd.ingestion.cli:main"
rag-chunk = "rag_rgpd.processing.cli:main"
rag-index = "rag_rgpd.answering.cli:index_main"
rag-ask = "rag_rgpd.answering.cli:ask_main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
