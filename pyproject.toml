[project]
name = "rag-rgpd"
version = "0.1.0"
description = "Assistant RAG sur la protection des données au Luxembourg, qui cite ses sources."
readme = "README.md"
authors = [
    { name = "FRANKS" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
